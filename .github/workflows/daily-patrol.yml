name: 每日 GA4 数据简报与新加坡 Supabase 后台巡检

on:
  schedule:
    # 每天 UTC 00:30 运行，对应北京时间每天早上 08:30
    - cron: '30 0 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  daily-patrol:
    name: 拉取 GA4 昨日数据并清理排行榜异常高分
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库代码
        uses: actions/checkout@v4

      - name: 配置 Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 执行每日巡检与中文简报生成
        env:
          GA4_PROPERTY_ID: ${{ secrets.GA4_PROPERTY_ID }}
          GA4_SERVICE_ACCOUNT_JSON: ${{ secrets.GA4_SERVICE_ACCOUNT_JSON }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          GAME_ID: ${{ vars.VITE_GAME_ID || 'star-dash-v1' }}
          REPORT_WEBHOOK_URL: ${{ secrets.REPORT_WEBHOOK_URL }}
        run: node scripts/daily-patrol.mjs

      - name: 归档每日中文简报（保留 30 天）
        uses: actions/upload-artifact@v4
        with:
          name: daily-patrol-report
          path: reports/*.md
          retention-days: 30
