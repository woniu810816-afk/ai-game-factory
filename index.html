<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#0b0a10" />
  <title>INVESTITURE: Relic Forge</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }
    html, body {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      overscroll-behavior: none;
      overscroll-behavior-y: none;
      background: radial-gradient(circle at 50% 24%, #1f1712 0%, #0b0a10 78%);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
      touch-action: none;
      pointer-events: auto;
    }
    /* 严格保留 block 布局交由 Phaser ScaleManager 统一居中缩放，杜绝 Flexbox 叠加导致 iOS Retina 触控坐标偏移 */
    #app {
      position: fixed;
      inset: 0;
      display: block;
      width: 100%;
      height: 100%;
      overflow: hidden;
      overscroll-behavior: none;
      touch-action: none;
      pointer-events: auto;
    }
    canvas {
      display: block;
      touch-action: none;
      pointer-events: auto;
      box-shadow: 0 18px 60px rgba(0, 0, 0, 0.7);
    }
  </style>
  <!-- 门户 SDK 占位标记：由打包脚本 scripts/package-portal.mjs 按目标渠道按需注入，避免跨渠道冗余外链 -->
  <!-- PORTAL_SDK_INJECT -->
</head>
<body>
  <div id="app"></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
